<section class="hero" id="top">
  <app-flow-field [sources]="heroSources()" (ready)="onFieldReady()" />

  <div class="container hero__content">
    <div class="hero__text" [class.is-ghosted]="fieldReady()">
      <p class="hero__eyebrow" #heroLine>{{ profile.role }} at {{ profile.location }}</p>
      <h1 class="hero__title" #heroLine>Hi, I'm {{ profile.firstName }} :)</h1>
      <p class="hero__tagline" #heroLine>{{ profile.tagline }}</p>
    </div>

    <div class="hero__actions">
      <a class="btn btn--primary" routerLink="/" fragment="projects">View my work</a>
      <a class="btn btn--ghost" routerLink="/" fragment="contact">Get in touch</a>
    </div>
  </div>
</section>

<!--
  One page, three sections. Each is the same component the site already had —
  embedded rather than duplicated, so there's still exactly one source of truth
  for the project list, the bio and the contact form.
-->
<app-projects id="projects" />
<app-about id="about" />
<app-contact id="contact" />
