<section class="section">
  <div class="container">
    <h2 class="section__title">Projects</h2>
    <p class="projects__intro">
      Mostly robotics and the maths underneath it. Each one links to its source.
    </p>

    <ol class="projects">
      @for (project of projects(); track project.slug) {
        <li>
          <app-project-card [project]="project" [index]="$index + 1" [flipped]="$odd" />
        </li>
      }
    </ol>
  </div>
</section>
