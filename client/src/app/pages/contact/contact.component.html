<section class="section">
  <div class="container contact">
    <div class="contact__lead">
      <h2 class="section__title"><span class="section__index">05</span> Contact</h2>
      <p class="contact__intro">
        The quickest way to reach me is any of these. I answer email fastest.
      </p>
    </div>

    <ul class="socials">
      @for (social of profile.socials; track social.url) {
        <li>
          <a
            class="socials__link"
            [href]="social.url"
            [attr.target]="social.icon === 'gmail' ? null : '_blank'"
            rel="noopener noreferrer"
          >
            <svg class="socials__icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              @switch (social.icon) {
                @case ('github') {
                  <path
                    d="M12 .3a12 12 0 0 0-3.8 23.4c.6.1.8-.3.8-.6v-2c-3.3.7-4-1.6-4-1.6-.6-1.4-1.4-1.8-1.4-1.8-1-.7.1-.7.1-.7 1.2.1 1.8 1.2 1.8 1.2 1 1.8 2.8 1.3 3.5 1 .1-.8.4-1.3.7-1.6-2.7-.3-5.5-1.3-5.5-5.9 0-1.3.5-2.4 1.2-3.2 0-.4-.5-1.6.1-3.2 0 0 1-.3 3.3 1.2a11.5 11.5 0 0 1 6 0c2.3-1.5 3.3-1.2 3.3-1.2.6 1.6.2 2.8.1 3.2.8.8 1.2 1.9 1.2 3.2 0 4.6-2.8 5.6-5.5 5.9.4.4.8 1.1.8 2.2v3.3c0 .3.2.7.8.6A12 12 0 0 0 12 .3Z"
                  />
                }
                @case ('linkedin') {
                  <path
                    d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.42v1.56h.04a3.75 3.75 0 0 1 3.37-1.85c3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13Zm1.78 13.02H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"
                  />
                }
                @case ('gmail') {
                  <path
                    d="M24 5.46v13.9c0 .9-.73 1.64-1.64 1.64h-3.81V11.73L12 16.64l-6.55-4.91v9.27H1.64A1.64 1.64 0 0 1 0 19.37V5.46c0-2.03 2.31-3.18 3.93-1.97l1.52 1.15L12 9.55l6.55-4.91 1.52-1.15C21.69 2.28 24 3.43 24 5.46Z"
                  />
                }
              }
            </svg>
            <span class="socials__handle">{{ social.handle }}</span>
            <span class="socials__arrow" aria-hidden="true">↗</span>
            <span class="sr-only">{{ social.label }}</span>
          </a>
        </li>
      }
    </ul>
  </div>
</section>
