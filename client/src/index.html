<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Ivan Hua — Portfolio</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Portfolio of Ivan Hua, a computer engineering student at Polytechnique Montréal working on robotics, algorithms and AI."
    />
    <link rel="canonical" href="https://ivanhua2004.github.io/Personal-Portfoflio/" />

    <!--
      What LinkedIn, X and Slack read when the link is shared. Without these the
      preview is a bare URL on a blank card.

      og:image must be an absolute URL — crawlers don't resolve relative paths —
      and the file has to be reachable without JavaScript, which is why it sits
      in public/ rather than being set at runtime.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ivan Hua" />
    <meta property="og:title" content="Ivan Hua — Computer engineering student" />
    <meta
      property="og:description"
      content="Robotics, algorithms and AI. Projects in ROS 2, C++ and Angular."
    />
    <meta property="og:url" content="https://ivanhua2004.github.io/Personal-Portfoflio/" />
    <meta
      property="og:image"
      content="https://ivanhua2004.github.io/Personal-Portfoflio/og-image.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The portfolio hero, with its headings drawn in particles" />

    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
